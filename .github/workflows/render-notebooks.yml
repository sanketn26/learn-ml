name: Render Notebooks to Docs

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**/*.ipynb"
      - "langchain/notebooks/**/*.ipynb"
      - "langgraph/notebooks/**/*.ipynb"
      - "crewai/notebooks/**/*.ipynb"
      - "enhance_html.py"
      - "notebooks/course.css"
      - "notebooks/course_style.py"
      - ".github/workflows/render-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install convert + enhance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Convert notebooks to HTML
        run: |
          set -euo pipefail
          shopt -s nullglob
          convert() {
            local src="$1" dest="$2"
            mkdir -p "$dest"
            local files=("$src"/week-*.ipynb)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No notebooks in $src"
              return 0
            fi
            jupyter nbconvert --to html --output-dir="$dest" "${files[@]}"
          }
          convert notebooks docs
          convert langchain/notebooks langchain/docs
          convert langgraph/notebooks langgraph/docs
          convert crewai/notebooks crewai/docs

      - name: Add navigation and local-run paths
        run: python enhance_html.py

      - name: Commit rendered docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html langchain/docs/*.html langgraph/docs/*.html crewai/docs/*.html
          if git diff --cached --quiet; then
            echo "No HTML changes"
          else
            git commit -m "chore: render notebooks to docs (CI)"
            git push
          fi
